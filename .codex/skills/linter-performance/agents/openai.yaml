interface:
  display_name: "Linter Performance"
  short_description: "Speed up linting with separate zero-diagnostic gate"
  default_prompt: "Use $linter-performance /absolute/target/path. Measure the full production lint path; diagnostics never affect timing acceptance. After a valid timing pass, immediately invoke diagnostics-to-zero on the linter workspace and continue until zero or the user stops. Check train.py process presence before/after measurements and refresh the control baseline whenever it appears or disappears. Reuse compatible baselines, screen weak candidates, follow sampler evidence, and avoid retrying rejected mechanisms without new evidence. Prepare the next hypothesis during measurements without changing inputs. Recheck final timing after execution-affecting diagnostic repairs. Only the coordinator may launch processes. Keep timing, diagnostic and correctness state in .ai-code-guard/work-status.md; pass a complete same-snapshot diagnostic report to diagnostics-to-zero when available, not just benchmark counts. Load journal/checklist instructions only for a new performance task. Clear the performance journal at a new task start; keep compact attempt rows, attempt numbers, and a 50-idea checklist with stable IDs and explicit outcomes, preserving them across continuations. Do not spawn or assign agents unless the user explicitly requests delegation."
