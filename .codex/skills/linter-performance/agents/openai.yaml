interface:
  display_name: "Linter Performance"
  short_description: "Reduce cold/hot runtime ratio with a separate zero-diagnostic gate"
  default_prompt: "Use $linter-performance /absolute/target/path. Run exactly three matched cold/hot pairs for every baseline and candidate; optimize only the shortest cold duration divided by the shortest hot duration, chosen independently across the three pairs. Lower is better. Display Files/sec and per-pair ratios for context only; never use them to rank or accept a change. Keep the full production lint scope and configuration unchanged. Profile and try improvements anywhere on the critical path, including small cumulative gains. Diagnostics do not affect ratio acceptance. After a valid ratio pass, immediately invoke diagnostics-to-zero on the linter workspace and continue until zero or the user stops. Check train.py process presence before/after measurements and refresh the control baseline whenever it appears or disappears. Reuse compatible baselines, follow sampler evidence, and avoid retrying rejected mechanisms without new evidence. Prepare the next hypothesis during measurements without changing inputs. Recheck the final ratio after execution-affecting diagnostic repairs. Only the coordinator may launch processes. Keep timing, diagnostic and correctness state in .ai-code-guard/work-status.md; pass a complete same-snapshot diagnostic report to diagnostics-to-zero when available, not just benchmark counts. Load journal/checklist instructions only for a new performance task. Preserve prior experiment logs; keep compact attempt rows, attempt numbers, and a 50-idea checklist with stable IDs and explicit outcomes, preserving them across continuations. Do not spawn or assign agents unless the user explicitly requests delegation."
