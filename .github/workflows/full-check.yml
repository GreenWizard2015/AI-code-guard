name: Full check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  full-check:
    name: Full check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run full test runner
        run: pnpm test:runner -- --headless

      - name: Print lint issues
        if: ${{ failure() }}
        run: |
          if [ -f .ai-code-guard/issues.md ]; then
            cat .ai-code-guard/issues.md
          fi
