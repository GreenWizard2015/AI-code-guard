name: Full check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  full-check:
    name: Full check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Type-check TypeScript
        run: pnpm type-check

      - name: Run full test suite
        run: pnpm test

      - name: Run AI Code Guard lint
        run: pnpm lint

      - name: Check Python formatting
        run: python -m black --check src/parser/python-bridge

      - name: Run Ruff
        run: python -m ruff check --isolated --select E4,E7,E9,F src/parser/python-bridge

      - name: Run Pyflakes
        run: python -m pyflakes $(find src/parser/python-bridge -type f -name '*.py' -print)

      - name: Run Mypy
        env:
          MYPYPATH: ${{ github.workspace }}/src/parser/python-bridge
        run: python -m mypy --warn-unreachable --ignore-missing-imports --follow-imports=skip -m entrypoint

      - name: Run Vulture
        run: python -m vulture $(find src/parser/python-bridge -type f -name '*.py' -print) tests --exclude node_modules --min-confidence 80
